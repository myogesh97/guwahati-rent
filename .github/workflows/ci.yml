# Checks on every push and pull request. Mirrors what NEXT-PHASES §0.6 asks for before any report.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:deno
      - run: npm run build
      - name: Production bundle must not contain demo code or a secret key
        run: |
          ! grep -rl "demoPins\|__grMap" dist/
          ! grep -rlE "sb_secret_[A-Za-z0-9]{10,}|SUPABASE_SERVICE_ROLE_KEY=" dist/
          test -f dist/robots.txt && test -f dist/sitemap.xml

  # Applies every migration to a throwaway Postgres 17 + PostGIS (Supabase's major version) and
  # checks the SPEC §5 security rules and the stats rules (tests/db/run.sh). Never touches the real
  # project. Packages come from apt.postgresql.org, as in backup.yml, so they don't depend on which
  # PostgreSQL the runner image happens to preinstall.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 + PostGIS
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17 postgresql-17-postgis-3
      - name: Migrations + security/stats assertions
        run: PATH="/usr/lib/postgresql/17/bin:$PATH" bash tests/db/run.sh
